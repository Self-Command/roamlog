name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://roamlog:roamlog@localhost:5432/roamlog?schema=public
  ROAMLOG_TEST_DATABASE_URL: postgresql://roamlog:roamlog@localhost:5432/roamlog?schema=public
  REDIS_URL: redis://localhost:6379
  REDIS_PREFIX: roamlog-ci
  BETTER_AUTH_SECRET: ci-only-secret-value-that-is-long-enough-123456
  APP_URL: http://localhost:3000
  ADMIN_URL: http://localhost:3001
  API_URL: http://localhost:4000
  S3_ENDPOINT: http://localhost:9000
  S3_BUCKET: roamlog-ci
  S3_ACCESS_KEY: roamlog
  S3_SECRET_KEY: roamlog-ci-secret
  RESEND_API_KEY: re_ci_placeholder
  # Keep CI on the same map/search defaults as the product
  # (apps/web/components/map/globe-view.tsx, map-canvas.tsx and geo.ts).
  # demotiles/nominatim made the globe-style and Photon-attribution tests fail.
  NEXT_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
  NEXT_PUBLIC_GEOCODER_URL: https://photon.komoot.io/api/
  EXPORT_SIGNED_URL_TTL: "900"
  BOOTSTRAP_SUPER_ADMIN_EMAIL: admin@roamlog.local
  DEMO_SEED_ENABLED: "true"
  ROAMLOG_SEED_S3_UPLOAD: "false"

jobs:
  quality:
    name: Install, verify, and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roamlog
          POSTGRES_PASSWORD: roamlog
          POSTGRES_DB: roamlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roamlog -d roamlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO for S3 readiness
        run: |
          docker run -d --name roamlog-ci-minio \
            --user 0:0 \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            cgr.dev/chainguard/minio:latest \
            server /data

      - name: Wait for MinIO health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent \
              --connect-timeout 1 \
              --max-time 2 \
              http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "MinIO health check attempt ${attempt}/30 failed; retrying."
            sleep 2
          done

          echo "MinIO did not become healthy within 30 attempts." >&2
          docker logs roamlog-ci-minio >&2 || true
          exit 1

      - name: Bootstrap S3 buckets
        run: node tooling/services/bootstrap-bucket.mjs

      - name: Setup Python for staging checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install staging YAML validator
        run: python -m pip install PyYAML==6.0.3

      - name: Static staging, Docker, and workflow checks
        run: pnpm staging:validate

      - name: Compose config validation
        env:
          ROAMLOG_STAGING_ENV_FILE: staging.env.example
        run: >-
          docker compose
          --profile app
          --env-file docker/staging.env.example
          -f docker/compose.staging.yml
          config --quiet

      - name: Stage production env placeholder for compose validation
        # `docker compose config` resolves the `env_file` entries declared in
        # docker/compose.production.yml. The x-app-service anchor points at the
        # real host path (/opt/roamlog/config/.env.production), which does not
        # exist on a GitHub runner, so materialise that same absolute path from
        # the checked-in template. This is a CI-only placeholder containing no
        # real secret; production uses the operator-managed file at the same
        # path (see docker/production.env.example header).
        #
        # Ownership is the runner user while the mode stays 0600: the file is a
        # secret-free template, and `docker compose config` runs unprivileged,
        # so it must be able to read the file it validates. Production keeps the
        # same path root-owned with mode 0600 and a 0700 parent directory.
        #
        # Interpolation still reads `--env-file docker/production.env.example`
        # plus the CI-only ROAMLOG_IMAGE_TAG below, so this placeholder cannot
        # mask a missing `${VAR:?}` required variable. Never weaken those guards.
        run: |
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /opt/roamlog/config
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" docker/production.env.example /opt/roamlog/config/.env.production

      - name: Production compose config validation
        env:
          # compose.production.yml interpolates ${ROAMLOG_IMAGE_TAG:?}; the
          # checked-in template carries a CHANGE_ME placeholder, so pin a
          # CI-only tag for this static check. The `:?` guards stay as strict as
          # they are — never weaken them to make this step pass.
          ROAMLOG_IMAGE_TAG: ci-validate
        run: >-
          docker compose
          --env-file docker/production.env.example
          -f docker/compose.production.yml
          config --quiet

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed demo data
        env:
          ROAMLOG_SEED_S3_UPLOAD: "true"
        run: pnpm db:seed

      - name: Verify seed media objects
        run: pnpm --filter @roamlog/db exec tsx ../../tooling/services/verify-seed-media.ts

      - name: Test
        run: pnpm test

      - name: Contract and generated client freshness
        run: pnpm contracts:check

      - name: Build
        run: pnpm build

      - name: Start media worker for upload E2E
        run: |
          pnpm --filter @roamlog/worker exec tsx src/main.ts > /tmp/roamlog-worker.log 2>&1 &
          echo $! > /tmp/roamlog-worker.pid
          for _ in $(seq 1 30); do
            if grep -q '"event":"worker.ready"' /tmp/roamlog-worker.log; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/roamlog-worker.pid)" 2>/dev/null; then
              cat /tmp/roamlog-worker.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/roamlog-worker.log
          exit 1

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify smoke account provisioning contract
        run: pnpm exec vitest run e2e/support/provision-smoke-accounts.test.ts

      - name: Provision smoke member account
        run: |
          pnpm --filter @roamlog/api exec tsx ../../e2e/support/provision-smoke-accounts.ts \
            --action=create-member \
            --email='verify@roamlog.test' \
            --password='Roamlog-Verify-Aa1!' \
            --name='验收账号' \
            --workspace-slug='roamlog-crew' \
            --role=admin

      - name: Provision journal-layout workspace
        # The journal layout specs exercise the owner and read-only flows in a
        # dedicated workspace, so seed one after the shared smoke account has
        # been created. This is CI-only test data; no product code is copied.
        run: |
          cat > apps/api/ci-provision-journal-layout.ts <<'TS'
          import { createPrismaClient } from "@roamlog/db";

          void (async () => {
            const prisma = createPrismaClient();
            try {
              const owner = await prisma.user.findUniqueOrThrow({
                where: { email: "verify@roamlog.test" },
              });
              const workspace = await prisma.$transaction(async (tx) => {
                const workspace = await tx.workspace.upsert({
                  where: { slug: "verify-crew" },
                  update: { ownerId: owner.id },
                  create: {
                    name: "Verify Crew",
                    slug: "verify-crew",
                    ownerId: owner.id,
                    plan: "team",
                    settings: {},
                  },
                });
                await tx.workspaceMember.upsert({
                  where: {
                    workspaceId_userId: {
                      workspaceId: workspace.id,
                      userId: owner.id,
                    },
                  },
                  update: { role: "owner", status: "active" },
                  create: {
                    workspaceId: workspace.id,
                    userId: owner.id,
                    role: "owner",
                    status: "active",
                  },
                });
                return workspace;
              });
              console.log(JSON.stringify({ workspaceId: workspace.id, slug: workspace.slug }));
            } finally {
              await prisma.$disconnect();
            }
          })();
          TS
          pnpm --filter @roamlog/api exec tsx ci-provision-journal-layout.ts
          rm apps/api/ci-provision-journal-layout.ts

      - name: Provision journal-layout viewer
        run: |
          pnpm --filter @roamlog/api exec tsx ../../e2e/support/provision-smoke-accounts.ts \
            --action=create-member \
            --email='e2e-journal-viewer@roamlog.test' \
            --password='Roamlog-JournalViewer-Aa1!' \
            --name='JournalViewer' \
            --workspace-slug='verify-crew' \
            --role=viewer

      - name: E2E browser smoke
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm e2e:web --grep "dashboard renders real travel stats and next journey"

      - name: E2E trip visibility
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm exec playwright test e2e/web/trip-visibility.spec.ts --project=web

      - name: E2E stops place search
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm exec playwright test e2e/web/stops-place-search.spec.ts --project=web

      - name: E2E share map
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm exec playwright test e2e/web/share-map.spec.ts --project=web

      - name: E2E share media
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm exec playwright test e2e/web/share-media.spec.ts --project=web

      - name: E2E journal layout
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm exec playwright test e2e/web/journal-layout.spec.ts --project=web

      - name: E2E journal gallery upload
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
          E2E_SMOKE_WORKSPACE_SLUG: verify-crew
        run: pnpm exec playwright test e2e/web/journal-gallery-upload.spec.ts --project=web

      - name: E2E journal share password
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm exec playwright test e2e/web/journal-share-password.spec.ts --project=web

      - name: E2E journal layout security
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm exec playwright test e2e/web/journal-layout-security.spec.ts --project=web

      - name: E2E journal layout accessibility
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm exec playwright test e2e/web/journal-layout-a11y.spec.ts --project=web

      - name: E2E journal gallery drag
        env:
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
          E2E_SMOKE_WORKSPACE_SLUG: verify-crew
        run: pnpm exec playwright test e2e/web/journal-gallery-drag.spec.ts --project=web

      - name: E2E admin 2FA settings
        env:
          E2E_SKIP_WEB_SERVER: "1"
          E2E_START_API: "1"
          AUTH_RATE_LIMIT_MAX: "100"
        run: pnpm exec playwright test e2e/admin/smoke/admin-settings.spec.ts --project=admin

      - name: E2E admin provider settings
        env:
          AUTH_RATE_LIMIT_MAX: "100"
          E2E_START_API: "1"
          PROVIDER_CONFIG_MODE: "v2"
          PROVIDER_EGRESS_ALLOW_PRIVATE: "true"
          CONFIG_ENCRYPTION_KEY: "AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM="
        run: >-
          pnpm exec playwright test
          e2e/admin/smoke/admin-providers.spec.ts
          --project=admin
          --workers=1

      - name: E2E appearance
        env:
          AUTH_RATE_LIMIT_MAX: "100"
          E2E_START_API: "1"
        run: >-
          pnpm exec playwright test
          e2e/web/appearance.spec.ts
          e2e/admin/settings-appearance.spec.ts
          --workers=1

      - name: E2E API smoke
        env:
          E2E_SKIP_WEB_SERVER: "1"
          E2E_SKIP_ADMIN_SERVER: "1"
          E2E_START_API: "1"
        run: pnpm e2e:api

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
            .audit/journal-layout/*.png
            .audit/journal-layout/*.json
            .audit/journal-layout/a11y-*
            .audit/journal-layout/security-e2e-*
            .audit/journal-layout/gallery-drag-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload settings E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-e2e-evidence-${{ github.run_attempt }}
          path: |
            .audit/settings-provider-e2e/**
            .audit/theme-font/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop media worker
        if: always()
        run: |
          if [ -f /tmp/roamlog-worker.pid ]; then
            kill "$(cat /tmp/roamlog-worker.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/roamlog-worker.log ]; then
            tail -n 100 /tmp/roamlog-worker.log
          fi

  dependency-audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .audit/security
          pnpm audit --audit-level high --json | tee .audit/security/pnpm-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_attempt }}
          path: .audit/security/pnpm-audit.json
          if-no-files-found: warn
          retention-days: 7
