name: roamlog

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roamlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roamlog}
      POSTGRES_DB: ${POSTGRES_DB:-roamlog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-roamlog} -d ${POSTGRES_DB:-roamlog}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - roamlog-local

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - roamlog-local

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-roamlog}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-roamlog-local-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - roamlog-local

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-roamlog}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-roamlog-local-secret}
      S3_BUCKET: ${S3_BUCKET:-roamlog-local}
    volumes:
      - ./minio-init:/init:ro
    entrypoint: ["/bin/sh", "/init/01-create-bucket.sh"]
    networks:
      - roamlog-local

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - roamlog-local

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  roamlog-local:
    driver: bridge
