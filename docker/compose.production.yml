# Roamlog production stack (single host).
#
# This file is the production deployment. It is standalone: do not layer it on
# top of docker/compose.staging.yml. The staging pair
# (compose.staging.yml + compose.server.yml) is kept only as a legacy
# pre-production environment and is not the production stack.
#
# Invocation (always pass the production env file; interpolation reads it):
#   docker compose --env-file /opt/roamlog/config/.env.production \
#     -f docker/compose.production.yml config --quiet
#
# No secret is written in this file. Every credential is either read from
# /opt/roamlog/config/.env.production or injected through required-variable
# (`:?`) interpolation, which fails fast when the env file is incomplete.

name: roamlog

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared application service baseline. A single merge anchor is intentional:
# YAML forbids duplicate `<<` keys in one mapping.
x-app-service: &app-service
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file:
    - /opt/roamlog/config/.env.production
  logging: *default-logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - type: bind
        source: /opt/roamlog/data/postgres
        target: /var/lib/postgresql/data
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - type: bind
        source: /opt/roamlog/data/redis
        target: /data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    networks:
      - backend

  minio:
    # Digest-pinned to match the reviewed production image; do not replace with
    # a floating tag.
    image: docker.io/chainguard/minio@sha256:7618b82bba99aadd77fcf59eb6cfd89b4b8b8e01ac796c474d57a1c1abf17e79
    user: "65532:65532"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      # MinIO answers CORS at the server level; the S3 bucket CORS API is not
      # implemented by MinIO. The browser uploads from APP_URL straight to the
      # media host, so this must list the app origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MEDIA_CORS_ORIGINS:-http://localhost:3000}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - type: bind
        source: /opt/roamlog/data/minio
        target: /data
    ports:
      - "127.0.0.1:${PRODUCTION_MINIO_S3_PORT:-19000}:9000"
      - "127.0.0.1:${PRODUCTION_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read protocol code rest <&3;
          test "$$code" = "200"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    # `backend` is internal, and Docker drops published ports on an
    # internal-only network, so the media host (host nginx -> 127.0.0.1:19000)
    # needs the bridge network too. Ports stay bound to 127.0.0.1.
    networks:
      - edge
      - backend

  minio-init:
    # One-shot bucket bootstrap, opt-in via `--profile init`.
    #
    # It cannot block `api`/`worker` startup: the default MINIO_MC_IMAGE is a
    # distroless image without /bin/sh, and the script is a shell script. Run it
    # deliberately with an mc image that ships a shell, and never let a failed
    # bootstrap leave the app tier down.
    profiles: ["init"]
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      # Comma-separated browser origins allowed by the bucket CORS policy.
      MEDIA_CORS_ORIGINS: ${MEDIA_CORS_ORIGINS:-http://localhost:3000}
      MC_CONFIG_DIR: /tmp/mc
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./minio-init:/init:ro
    entrypoint: ["/bin/sh", "/init/01-create-bucket.sh"]
    logging: *default-logging
    networks:
      - backend

  migrate:
    image: ghcr.io/self-command/roamlog/migrate:${ROAMLOG_IMAGE_TAG:?ROAMLOG_IMAGE_TAG is required}
    <<: *app-service
    restart: "no"
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      CHECKPOINT_DISABLE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend

  api:
    image: ghcr.io/self-command/roamlog/api:${ROAMLOG_IMAGE_TAG:?ROAMLOG_IMAGE_TAG is required}
    <<: *app-service
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REDIS_PREFIX: ${REDIS_PREFIX:-roamlog}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_FORCE_PATH_STYLE: "true"
      # Browser-facing media origin. Presigned URLs sign the Host header, so
      # this must be the TLS host Nginx serves (see deploy/nginx/media.conf.example),
      # never the internal minio:9000. Required: the API refuses to boot in
      # production without it.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-900}
      TRUST_PROXY: "true"
      ADMIN_2FA_ENFORCED: "true"
    ports:
      - "127.0.0.1:${PRODUCTION_API_PORT:-14000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    networks:
      - backend
      - edge

  worker:
    image: ghcr.io/self-command/roamlog/worker:${ROAMLOG_IMAGE_TAG:?ROAMLOG_IMAGE_TAG is required}
    <<: *app-service
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      REDIS_PREFIX: ${REDIS_PREFIX:-roamlog}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_FORCE_PATH_STYLE: "true"
      # The worker only reads/writes objects over the internal endpoint; the
      # public values are passed through so both app services see one env shape.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-900}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    networks:
      - backend
      - egress

  web:
    image: ghcr.io/self-command/roamlog/web:${ROAMLOG_IMAGE_TAG:?ROAMLOG_IMAGE_TAG is required}
    <<: *app-service
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${PRODUCTION_WEB_PORT:-13000}:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0775
      - /app/.next/server/route-cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0775
    stop_grace_period: 30s
    networks:
      - edge
      - backend

  admin:
    image: ghcr.io/self-command/roamlog/admin:${ROAMLOG_IMAGE_TAG:?ROAMLOG_IMAGE_TAG is required}
    <<: *app-service
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${PRODUCTION_ADMIN_PORT:-13001}:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0775
      - /app/.next/server/route-cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0775
    stop_grace_period: 30s
    networks:
      - edge
      - backend

networks:
  edge:
    driver: bridge
  egress:
    driver: bridge
  backend:
    driver: bridge
    internal: true
